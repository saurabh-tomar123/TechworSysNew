<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - No Internet</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      color: #333;
      text-align: center;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      animation: fadeIn 0.8s ease-in-out;
    }

    .card h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #0b52d0;
    }

    .card p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .retry-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(90deg, #fad171 0%, #ff9f9f 43%, #0b52d0 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .retry-btn:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>You Are Offline</h1>
    <p>It seems you lost your internet connection.<br/>Check your network and try again.</p>
    <a href="/" class="retry-btn">🔄 Retry</a>
  </div>
</body>
</html>
